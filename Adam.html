<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE School - اتصل بنا</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        
        h2 {
            color: #3498db;
        }
        
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        textarea {
            height: 150px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .contact-info {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .links {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        .links a {
            margin: 0 10px;
            color: #3498db;
            text-decoration: none;
        }
        
        footer {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WE School</h1>
        <h2>اتصل بنا</h2>
        
        <p>إذا كان لديك أي أسئلة أو اقتراحات، يرجى التواصل معنا باستخدام النموذج أدناه.</p>
        
        <form>
            <div class="form-group">
                <label for="fullname">الاسم الكامل</label>
                <input type="text" id="fullname" placeholder="اسمك">
            </div>
            
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="بريدك الإلكتروني">
            </div>
            
            <div class="form-group">
                <label for="subject">الموضوع</label>
                <input type="text" id="subject" placeholder="الموضوع">
            </div>
            
            <div class="form-group">
                <label for="message">الرسالة</label>
                <textarea id="message" placeholder="اكتب رسالتك..."></textarea>
            </div>
            
            <button type="submit">إرسال الرسالة</button>
        </form>
        
        <div class="contact-info">
            <h3>مكتبنا</h3>
            <p><strong>العنوان:</strong> 123 شارع التعلم، القاهرة، مصر</p>
            <p><strong>الهاتف:</strong> +30 (234) 687 800</p>
            <p><strong>البريد الإلكتروني:</strong> info@weschool.edu</p>
        </div>
        
        <div class="links">
            <a href="#">من نحن</a>
            <a href="#">المدونة</a>
            <a href="#">التدريس</a>
            <a href="contact.html">اتصل بنا</a>
            <a href="login.html">تسجيل الدخول</a>
        </div>
        
        <footer>
            <p>© 2025 WE School. جميع الحقوق محفوظة.</p>
        </footer>
    </div>
</body>
</html>
